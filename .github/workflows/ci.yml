name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run bandit -q -r src
      - run: uv run pip-audit

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Verify PHASE 5 runtime, evidence and benchmark distribution
        run: |
          first="$(docker run --rm --network none ai-trading-lab:phase-5 \
            python -m ai_trading_lab backtest self-test)"
          second="$(docker run --rm --network none ai-trading-lab:phase-5 \
            python -m ai_trading_lab backtest self-test)"
          test "$first" = "$second"
          echo "$first" | grep '"status": "PASS"'
          experiment="$(docker compose --profile experiments run --rm experiments \
            python -m ai_trading_lab experiment self-test --root /artifacts/ci-smoke)"
          echo "$experiment" | grep '"status": "COMPLETE"'
          echo "$experiment" | grep '"verdict": "INCONCLUSIVE"'
          benchmark="$(docker compose --profile experiments run --rm experiments \
            python -m ai_trading_lab benchmark self-test --root /artifacts/ci-phase-5)"
          echo "$benchmark" | grep '"experiments_recorded": 103'
          echo "$benchmark" | grep '"runs": 100'
          echo "$benchmark" | grep '"verdict": "INCONCLUSIVE"'
      - name: Prove LIVE fails closed in the image
        run: |
          if docker run --rm --network none -e ATL_MODE=LIVE \
            ai-trading-lab:phase-5 python -m ai_trading_lab status; then
            echo "LIVE mode unexpectedly started"
            exit 1
          fi
