name: ai-trading-lab

services:
  research:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-trading-lab:phase-6
    environment:
      ATL_MODE: RESEARCH
      ATL_LOG_LEVEL: INFO
      TZ: UTC
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  data:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-trading-lab:phase-6
    profiles: [data]
    command: ["python", "-m", "ai_trading_lab", "status"]
    environment:
      ATL_MODE: RESEARCH
      ATL_LOG_LEVEL: INFO
      ATL_DATA_ROOT: /data
      TZ: UTC
    volumes:
      - market-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"

  experiments:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-trading-lab:phase-6
    profiles: [experiments]
    command: ["python", "-m", "ai_trading_lab", "status"]
    environment:
      ATL_MODE: BACKTEST
      ATL_LOG_LEVEL: INFO
      TZ: UTC
    network_mode: none
    volumes:
      - research-artifacts:/artifacts
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"

volumes:
  market-data:
  research-artifacts:
