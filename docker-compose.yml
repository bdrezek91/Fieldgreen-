name: ai-trading-lab

services:
  research:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-trading-lab:phase-1
    environment:
      ATL_MODE: RESEARCH
      ATL_LOG_LEVEL: INFO
      TZ: UTC
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
